<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin SPA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card {
            margin-bottom: 1.5rem;
        }

        .table-action-btns .btn {
            margin-right: 0.25rem;
        }
    </style>
</head>
<body class="bg-light">

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="mb-0">Панель администратора</h1>
            <a href="https://localhost:7250/swagger" target="_blank" class="btn btn-outline-dark">Swagger</a>
        </div>

        <div class="card border-primary">
            <div class="card-header bg-primary text-white">Авторизация</div>
            <div class="card-body">
                <form id="loginForm" class="row g-3 align-items-center">
                    <div class="col-md-4">
                        <input type="email" class="form-control" id="l_Email" placeholder="Email" required />
                    </div>
                    <div class="col-md-4">
                        <input type="password" class="form-control" id="l_Password" placeholder="Пароль" required />
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">Войти</button>
                    </div>
                    <div class="col-md-1">
                        <button type="button" id="logoutBtn" class="btn btn-outline-secondary w-100">Выйти</button>
                    </div>
                    <div class="col-md-1" id="loginStatus"></div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header fw-bold">Управление песней</div>
            <div class="card-body">
                <form id="songForm">
                    <input type="hidden" id="s_Id" value="0" />

                    <div class="row g-3">
                        <div class="col-md-5">
                            <label for="s_Title" class="form-label">Название песни</label>
                            <input type="text" class="form-control" id="s_Title" required />
                        </div>

                        <div class="col-md-4">
                            <label for="s_ArtistId" class="form-label">Исполнитель</label>
                            <select class="form-select" id="s_ArtistId" required>
                                <option value="">Выберите...</option>
                            </select>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Аудиофайл</label>
                            <input type="file" class="form-control" id="s_FileInput" accept=".mp3,.wav,.flac,.ogg" />
                            <button type="button" class="btn btn-sm btn-outline-primary mt-2 w-100" id="s_UploadBtn">Загрузить файл</button>
                            <input type="hidden" id="s_FilePath" />
                            <div class="form-text" id="s_FileStatus">Файл не выбран</div>
                        </div>
                    </div>

                    <div class="mt-3">
                        <label class="form-label d-block">Жанры</label>
                        <div id="songGenresContainer" class="d-flex flex-wrap gap-3">
                        </div>
                    </div>

                    <div class="mt-4">
                        <button type="submit" class="btn btn-success">Сохранить песню</button>
                        <button type="button" class="btn btn-secondary" onclick="resetSongForm()">Сбросить</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header fw-bold">Управление жанром</div>
            <div class="card-body">
                <form id="genreForm" class="row g-3 align-items-end">
                    <input type="hidden" id="g_Id" value="0" />
                    <div class="col-md-6">
                        <label for="g_Name" class="form-label">Название жанра</label>
                        <input type="text" class="form-control" id="g_Name" required />
                    </div>
                    <div class="col-md-6">
                        <button type="submit" class="btn btn-success">Сохранить жанр</button>
                        <button type="button" class="btn btn-secondary" onclick="resetGenreForm()">Сбросить</button>
                    </div>
                </form>
            </div>
        </div>
        <div class="card">
            <div class="card-header fw-bold">Управление комментарием</div>
            <div class="card-body">
                <form id="commentForm" class="row g-3 align-items-end">
                    <input type="hidden" id="c_Id" value="0" />
                    <div class="col-md-3">
                        <label class="form-label">Песня</label>
                        <select class="form-select" id="c_SongId" required>
                            <option value="">Выберите...</option>
                        </select>
                    </div>
                    <div class="col-md-3" id="c_UserWrap">
                        <label class="form-label">Пользователь (ID)</label>
                        <input type="number" class="form-control" id="c_UserId" required />
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Текст комментария</label>
                        <input type="text" class="form-control" id="c_Text" maxlength="1000" required />
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-success w-100">Сохранить</button>
                        <button type="button" class="btn btn-secondary w-100 mt-2" onclick="resetCommentForm()">Сбросить</button>
                    </div>
                </form>
            </div>
        </div>
        <div class="col-lg-12 mt-4">
            <h3>Список комментариев</h3>
            <table class="table table-bordered table-striped align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Песня</th>
                        <th>Пользователь</th>
                        <th>Текст</th>
                        <th>Дата</th>
                        <th style="width: 140px;">Действия</th>
                    </tr>
                </thead>
                <tbody id="commentsTableBody"></tbody>
            </table>
        </div>

        <div class="row">
            <div class="col-lg-8">
                <h3>Список песен</h3>
                <table class="table table-bordered table-striped align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Название</th>
                            <th>Исполнитель</th>
                            <th>Жанры</th>
                            <th style="width: 170px;">Действия</th>
                        </tr>
                    </thead>
                    <tbody id="songsTableBody"></tbody>
                </table>
            </div>

            <div class="col-lg-4">
                <h3>Список жанров</h3>
                <table class="table table-bordered table-striped align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Название</th>
                            <th style="width: 140px;">Действия</th>
                        </tr>
                    </thead>
                    <tbody id="genresTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-body" id="toastMessage"></div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const apiBase = "https://localhost:7250";

        const api = {
            users: apiBase + "/api/Users",
            songs: apiBase + "/api/Songs",
            genres: apiBase + "/api/Genres",
            roles: apiBase + "/api/Roles",
            artists: apiBase + "/api/Artists",
            comments: apiBase + "/api/Comments",
            auth: apiBase + "/api/auth"
        };

        function showToast(message, isError = false) {
            const toastEl = $("#liveToast");
            $("#toastMessage").text(message);
            toastEl.removeClass("bg-danger bg-success text-white");
            toastEl.addClass(isError ? "bg-danger text-white" : "bg-success text-white");
            const bsToast = new bootstrap.Toast(toastEl[0]);
            bsToast.show();
        }

        function ajaxRequest(method, url, data, isFormData, silent) {
            const options = {
                url: url,
                method: method,
                xhrFields: { withCredentials: true }
            };
            if (isFormData) {
                options.data = data;
                options.processData = false;
                options.contentType = false;
            } else {
                options.contentType = "application/json";
                options.data = data ? JSON.stringify(data) : undefined;
            }
            return $.ajax(options).fail(function (xhr) {
                if (silent) return;
                let msg = "Ошибка запроса (" + xhr.status + ")";
                if (xhr.status === 401) msg = "Требуется авторизация. Войдите через форму выше.";
                else if (xhr.status === 403) msg = "Доступ запрещён (нужна роль Admin)";
                else if (xhr.responseJSON?.message) msg = xhr.responseJSON.message;
                showToast(msg, true);
            });
        }

        //Авторизация

        $("#loginForm").on("submit", function (e) {
            e.preventDefault();
            ajaxRequest("POST", api.auth + "/login", {
                email: $("#l_Email").val(),
                password: $("#l_Password").val()
            }).done(function (user) {
                $("#loginStatus").html('<span class="text-success">Вошли как ' + (user.username || user.email) + '</span>');
                showToast("Успешный вход");
                loadSongs();
                loadGenres();
                loadArtists();
                loadSongsLookupForComments();
                loadComments();
            });
        });

        $("#logoutBtn").on("click", function () {
            ajaxRequest("POST", api.auth + "/logout").done(function () {
                $("#loginStatus").html('<span class="text-muted">Вы вышли</span>');
                showToast("Вы вышли из системы");
            });
        });

        //Загрузка файла песни

        $("#s_UploadBtn").on("click", function () {
            const fileInput = document.getElementById("s_FileInput");
            if (!fileInput.files.length) {
                showToast("Выберите файл", true);
                return;
            }
            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            $("#s_FileStatus").text("Загрузка...").removeClass("text-danger text-success");

            ajaxRequest("POST", api.songs + "/upload", formData, true).done(function (result) {
                $("#s_FilePath").val(result.filePath);
                $("#s_FileStatus").text("Загружен: " + result.filePath).addClass("text-success");
                showToast("Файл загружен");
            }).fail(function () {
                $("#s_FileStatus").text("Ошибка загрузки").addClass("text-danger");
            });
        });

        //Форма песни

        $("#songForm").on("submit", function (e) {
            e.preventDefault();
            const id = parseInt($("#s_Id").val()) || 0;
            const genreIds = $(".song-genre-checkbox:checked").map(function () { return parseInt($(this).val()); }).get();

            if (id === 0 && !$("#s_FilePath").val()) {
                showToast("Сначала загрузите аудиофайл", true);
                return;
            }

            const dto = {
                id: id,
                title: $("#s_Title").val(),
                filePath: $("#s_FilePath").val(),
                artist: { id: parseInt($("#s_ArtistId").val()) },
                genres: genreIds.map(function (gid) { return { id: gid }; })
            };

            if (!dto.artist.id) {
                showToast("Выберите исполнителя", true);
                return;
            }

            const request = id === 0
                ? ajaxRequest("POST", api.songs, dto)
                : ajaxRequest("PUT", api.songs, dto);

            request.done(function () {
                showToast(id === 0 ? "Песня создана" : "Песня обновлена");
                resetSongForm();
                loadSongs();
            });
        });

        function resetSongForm() {
            $("#s_Id").val(0);
            $("#s_Title").val("");
            $("#s_ArtistId").val("");
            $("#s_FilePath").val("");
            $("#s_FileInput").val("");
            $("#s_FileStatus").text("Файл не выбран").removeClass("text-success text-danger");
            $(".song-genre-checkbox").prop("checked", false);
        }

        //Форма жанра

        $("#genreForm").on("submit", function (e) {
            e.preventDefault();
            const id = parseInt($("#g_Id").val()) || 0;
            const name = $("#g_Name").val();

            const request = id === 0
                ? ajaxRequest("POST", api.genres, { name: name })
                : ajaxRequest("PUT", api.genres, { id: id, name: name });

            request.done(function () {
                showToast(id === 0 ? "Жанр создан" : "Жанр обновлён");
                resetGenreForm();
                loadGenres();
            });
        });

        function resetGenreForm() {
            $("#g_Id").val(0);
            $("#g_Name").val("");
        }

        //Загрузка данных

        function loadSongs() {
            ajaxRequest("GET", api.songs).done(function (songs) {
                const tbody = $("#songsTableBody").empty();
                if (!songs || !songs.length) {
                    tbody.append('<tr><td colspan="5" class="text-center text-muted">Песни не найдены</td></tr>');
                    return;
                }
                songs.forEach(song => {
                    const genresStr = song.genres ? song.genres.map(g => g.name).join(", ") : "";
                    tbody.append(`
                                <tr>
                                    <td>${song.id}</td>
                                    <td>${song.title}</td>
                                    <td>${song.artist?.name || "—"}</td>
                                    <td>${genresStr}</td>
                                    <td class="table-action-btns">
                                        <button class="btn btn-sm btn-warning" onclick="editSong(${song.id})">Ред.</button>
                                        <button class="btn btn-sm btn-danger" onclick="deleteSong(${song.id})">Уд.</button>
                                    </td>
                                </tr>
                            `);
                });
            });
        }

        function loadGenres() {
            ajaxRequest("GET", api.genres).done(function (genres) {
                const container = $("#songGenresContainer").empty();
                const tbody = $("#genresTableBody").empty();

                if (!genres || !genres.length) {
                    container.append('<span class="text-muted">Жанры отсутствуют</span>');
                    tbody.append('<tr><td colspan="3" class="text-center text-muted">Нет жанров</td></tr>');
                    return;
                }

                genres.forEach(genre => {
                    container.append(`
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input song-genre-checkbox" type="checkbox" id="g_check_${genre.id}" value="${genre.id}">
                                    <label class="form-check-label" for="g_check_${genre.id}">${genre.name}</label>
                                </div>
                            `);

                    tbody.append(`
                                <tr>
                                    <td>${genre.id}</td>
                                    <td>${genre.name}</td>
                                    <td class="table-action-btns">
                                        <button class="btn btn-sm btn-warning" onclick="editGenre(${genre.id}, '${genre.name}')">Ред.</button>
                                        <button class="btn btn-sm btn-danger" onclick="deleteGenre(${genre.id})">Уд.</button>
                                    </td>
                                </tr>
                            `);
                });
            });
        }

        function loadArtists() {
            ajaxRequest("GET", api.artists).done(function (artists) {
                const select = $("#s_ArtistId").empty().append('<option value="">Выберите...</option>');
                if (artists) {
                    artists.forEach(artist => {
                        select.append(`<option value="${artist.id}">${artist.name}</option>`);
                    });
                }
            });
        }

        //Действия над жанрами

        function editGenre(id, name) {
            $("#g_Id").val(id);
            $("#g_Name").val(name);
        }

        function deleteGenre(id) {
            if (confirm("Удалить жанр?")) {
                ajaxRequest("DELETE", api.genres + "/" + id).done(function () {
                    showToast("Жанр удален");
                    loadGenres();
                });
            }
        }

        //Действия над песнями

        function editSong(id) {
            ajaxRequest("GET", api.songs + "/" + id).done(function (song) {
                $("#s_Id").val(song.id);
                $("#s_Title").val(song.title);
                $("#s_ArtistId").val(song.artist?.id || "");
                $("#s_FilePath").val(song.filePath);
                $("#s_FileStatus").text("Текущий файл: " + song.filePath).addClass("text-success");

                $(".song-genre-checkbox").prop("checked", false);
                if (song.genres) {
                    song.genres.forEach(g => {
                        $(`#g_check_${g.id}`).prop("checked", true);
                    });
                }
            });
        }

        function deleteSong(id) {
            if (confirm("Удалить песню?")) {
                ajaxRequest("DELETE", api.songs + "/" + id).done(function () {
                    showToast("Песня удалена");
                    loadSongs();
                });
            }
        }

        //Комментарии

        $("#commentForm").on("submit", function (e) {
            e.preventDefault();
            const id = parseInt($("#c_Id").val()) || 0;
            const text = $("#c_Text").val();

            if (id === 0) {
                const dto = {
                    songId: parseInt($("#c_SongId").val()),
                    userId: parseInt($("#c_UserId").val()),
                    text: text
                };
                if (!dto.songId) { showToast("Выберите песню", true); return; }
                if (!dto.userId) { showToast("Укажите ID пользователя", true); return; }

                ajaxRequest("POST", api.comments, dto).done(function () {
                    showToast("Комментарий добавлен");
                    resetCommentForm();
                    loadComments();
                });
            } else {
                const dto = { id: id, text: text };
                ajaxRequest("PUT", api.comments, dto).done(function () {
                    showToast("Комментарий обновлён");
                    resetCommentForm();
                    loadComments();
                });
            }
        });

        function resetCommentForm() {
            $("#c_Id").val(0);
            $("#c_SongId").val("");
            $("#c_UserId").val("");
            $("#c_Text").val("");
            $("#c_UserWrap").show();
        }

        function loadComments() {
            ajaxRequest("GET", api.comments).done(function (comments) {
                const tbody = $("#commentsTableBody").empty();
                if (!comments || !comments.length) {
                    tbody.append('<tr><td colspan="6" class="text-center text-muted">Комментариев нет</td></tr>');
                    return;
                }
                comments.forEach(c => {
                    const date = new Date(c.createdAt).toLocaleString("ru-RU");
                    tbody.append(`
                <tr>
                    <td>${c.id}</td>
                    <td>${c.song?.title || "—"}</td>
                    <td>${c.user?.username || "—"}</td>
                    <td>${c.text}</td>
                    <td>${date}</td>
                    <td class="table-action-btns">
                        <button class="btn btn-sm btn-warning" onclick="editComment(${c.id})">Ред.</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteComment(${c.id})">Уд.</button>
                    </td>
                </tr>
            `);
                });
            });
        }

        function editComment(id) {
            ajaxRequest("GET", api.comments + "/" + id).done(function (c) {
                $("#c_Id").val(c.id);
                $("#c_Text").val(c.text);
                $("#c_SongId").val(c.song?.id || "");
                $("#c_UserId").val(c.user?.id || "");
                $("#c_UserWrap").hide();
            });
        }

        function deleteComment(id) {
            if (confirm("Удалить комментарий?")) {
                ajaxRequest("DELETE", api.comments + "/" + id).done(function () {
                    showToast("Комментарий удалён");
                    loadComments();
                });
            }
        }

        function loadSongsLookupForComments() {
            ajaxRequest("GET", api.songs).done(function (songs) {
                const select = $("#c_SongId").empty().append('<option value="">Выберите...</option>');
                songs.forEach(s => select.append(`<option value="${s.id}">${s.title}</option>`));
            });
        }

        // Инициализация

        $(document).ready(function () {
            ajaxRequest("GET", api.auth + "/me", null, false, true).done(function (me) {
                $("#loginStatus").html('<span class="text-success">Уже авторизован</span>');
                loadSongs();
                loadGenres();
                loadArtists();
                loadSongsLookupForComments();
                loadComments();
            });
        });
    </script>
</body>
</html>
