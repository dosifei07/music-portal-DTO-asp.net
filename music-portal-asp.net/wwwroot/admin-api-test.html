<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Админ-панель: Жанры</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.0/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://ajax.aspnetcdn.com/ajax/jquery/jquery-2.2.0.min.js"></script>
</head>
<body>
    <div class="container mt-4">
        <h2>Управление жанрами</h2>
        <form name="genreForm" class="row g-2 align-items-end mb-3">
            <input type="hidden" name="Id" value="0" />
            <div class="col-md-4">
                <label>Название жанра:</label>
                <input class="form-control" name="name" />
            </div>
            <div class="col-md-4">
                <a id="submit" class="btn btn-primary">Сохранить</a>
                <a id="reset" class="btn btn-secondary">Сбросить</a>
            </div>
        </form>

        <table class="table table-striped">
            <thead><tr><th>Id</th><th>Название</th><th></th></tr></thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        const apiUrl = window.location.origin + "/api/genres";

        GetGenres();

        function GetGenres() {
            $.ajax({
                url: apiUrl,
                method: "GET",
                contentType: "application/json",
                success: function (genres) {
                    let rows = "";
                    $.each(genres, function (i, g) { rows += row(g); });
                    $("table tbody").html(rows);
                },
                error: function (x) { alert(x.status); }
            });
        }

        function GetGenre(id) {
            $.ajax({
                url: apiUrl + "/" + id,
                method: "GET",
                contentType: "application/json",
                success: function (g) {
                    let form = document.forms["genreForm"];
                    form.elements["Id"].value = g.id;
                    form.elements["name"].value = g.name;
                },
                error: function (x) { alert(x.status); }
            });
        }

        function CreateGenre(name) {
            $.ajax({
                url: apiUrl,
                contentType: "application/json",
                method: "POST",
                data: JSON.stringify({ name: name }),
                success: function (g) {
                    $("table tbody").append(row(g));
                    resetForm();
                },
                error: function (x) { alert(x.status); }
            });
        }

        function EditGenre(id, name) {
            $.ajax({
                url: apiUrl,
                contentType: "application/json",
                method: "PUT",
                data: JSON.stringify({ id: id, name: name }),
                success: function (g) {
                    $("tr[data-rowid='" + g.id + "']").replaceWith(row(g));
                    resetForm();
                },
                error: function (x) { alert(x.status); }
            });
        }

        function DeleteGenre(id) {
            if (!confirm("Удалить жанр?")) return;
            $.ajax({
                url: apiUrl + "/" + id,
                contentType: "application/json",
                method: "DELETE",
                success: function (g) { $("tr[data-rowid='" + g.id + "']").remove(); },
                error: function (x) { alert(x.status); }
            });
        }

        function row(g) {
            return "<tr data-rowid='" + g.id + "'><td>" + g.id + "</td><td>" + g.name + "</td>" +
                "<td><a class='editLink' data-id='" + g.id + "'>Изменить</a> | " +
                "<a class='removeLink' data-id='" + g.id + "'>Удалить</a></td></tr>";
        }

        function resetForm() {
            let form = document.forms["genreForm"];
            form.reset();
            form.elements["Id"].value = 0;
        }

        $("#reset").click(function (e) { e.preventDefault(); resetForm(); });

        $("#submit").click(function (e) {
            e.preventDefault();
            let form = document.forms["genreForm"];
            let id = form.elements["Id"].value;
            let name = form.elements["name"].value;
            if (id == 0) CreateGenre(name);
            else EditGenre(id, name);
        });

        $("body").on("click", ".editLink", function () { GetGenre($(this).data("id")); });
        $("body").on("click", ".removeLink", function () { DeleteGenre($(this).data("id")); });
    </script>
</body>
</html>
